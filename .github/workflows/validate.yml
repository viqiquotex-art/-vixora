name: Validate VIXORA

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check Cloudflare Worker syntax
        run: node --check worker.js
      - name: Install dependencies
        run: npm install
      - name: Build website
        run: npm run build
