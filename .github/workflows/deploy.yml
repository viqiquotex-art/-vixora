name: Deploy VIXORA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Clean previous build output
        run: rm -rf dist

      - name: Verify Supabase configuration
        env:
          VIXORA_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VIXORA_SUPABASE_PUBLISHABLE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VIXORA_SUPABASE_PUBLISHABLE_KEY"
          echo "Supabase publishable key: configured"

      - name: Build Vite
        env:
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VIXORA_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build -- --outDir dist --emptyOutDir

      - name: Ensure custom domain
        run: cp CNAME dist/CNAME

      - name: Verify production artifact
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -f dist/CNAME
          test -d dist/assets
          js_count=$(find dist/assets -type f -name '*.js' | wc -l)
          echo "Production JavaScript bundles: $js_count"
          test "$js_count" -gt 0
          echo "Built files:"
          find dist -maxdepth 2 -type f | sort

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
