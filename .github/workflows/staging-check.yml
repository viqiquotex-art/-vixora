name: VIXORA staging checks

on:
  push:
    branches: [redesign/sveltekit-staging]
  pull_request:
    branches: [main]
    paths:
      - 'src/routes/**'
      - 'src/app.html'
      - 'svelte.config.js'
      - 'vite.config.ts'
      - 'package.json'
      - 'tsconfig.json'
      - 'wrangler.toml'
      - '.github/workflows/staging-check.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Type and Svelte checks
        run: npm run check
      - name: Production build
        run: npm run build
