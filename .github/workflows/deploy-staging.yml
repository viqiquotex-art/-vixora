name: Deploy VIXORA staging

on:
  workflow_dispatch:
  push:
    branches:
      - redesign/sveltekit-staging

permissions:
  contents: read

concurrency:
  group: vixora-staging-deploy-v3
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy isolated staging Worker
    runs-on: ubuntu-latest
    steps:
      - name: Check required secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing repository secret CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing repository secret CLOUDFLARE_ACCOUNT_ID"; exit 1; }

      - name: Checkout staging branch
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Type and Svelte checks
        run: npm run check

      - name: Build SvelteKit for Cloudflare
        run: npm run build

      - name: Deploy staging Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.toml

      - name: Smoke test deployed staging Worker
        shell: bash
        run: |
          set -euo pipefail
          URL="https://vixora-workspace-staging.viqiquotex.workers.dev/api/health"
          payload="$(curl --retry 8 --retry-all-errors --retry-delay 2 --retry-max-time 45 --fail --silent --show-error "$URL")"
          printf '%s' "$payload" | node --input-type=module -e '
            let raw = "";
            process.stdin.on("data", (chunk) => raw += chunk);
            process.stdin.on("end", () => {
              let body;
              try { body = JSON.parse(raw); }
              catch { console.error("Staging health endpoint returned invalid JSON"); process.exit(1); }
              if (body.ok !== true || body.service !== "vixora-workspace-staging" || body.mode !== "staging") {
                console.error("Unexpected staging health response:", body);
                process.exit(1);
              }
              console.log("Staging health check passed:", JSON.stringify(body));
            });
          '
      - name: Smoke test Agent Run storage authentication
        shell: bash
        run: |
          set -euo pipefail
          URL="https://nuofddhqznewkkryejmu.supabase.co/functions/v1/agent-run-storage"
          KEY="sb_publishable_U3J8wBprqpGtq7-17XKmoA_OTGB0Bqp"
          body_file="$(mktemp)"
          status="$(curl --silent --show-error -o "$body_file" -w '%{http_code}' -H "apikey: $KEY" -H "Accept: application/json" "$URL")"
          test "$status" = "401" || { echo "Expected unauthenticated Agent Run request to return 401, got $status"; cat "$body_file"; exit 1; }
          node --input-type=module - "$body_file" <<'NODE'
          import { readFileSync } from "node:fs";
          const body = JSON.parse(readFileSync(process.argv[2], "utf8"));
          if (body.error !== "Sign in is required.") {
            console.error("Unexpected Agent Run authentication response:", body);
            process.exit(1);
          }
          console.log("Agent Run storage correctly rejects requests without a user session.");
          NODE
