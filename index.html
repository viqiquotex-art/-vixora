<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VIXORA</title>

<style>

/* =========================================
   VIXORA — WHITE EMBOSSED THEME
========================================= */

* {
  box-sizing: border-box;
}

:root {
  --bg: #f3f4f6;
  --surface: #f7f8fa;
  --surface-2: #eef0f3;
  --text: #202124;
  --muted: #858991;
  --border: rgba(255,255,255,.8);
  --accent: #6d5dfc;
  --accent-2: #8b7cff;
}

html,
body {
  width: 100%;
  height: 100%;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family:
    Inter,
    -apple-system,

    "Segoe UI",

  background-image:
    radial-gradient(

      transparent 1px

}


/* =========================================
   APP
========================================= */

.app {
  height: 100vh;
  display: flex;
  flex-direction: column;
}


/* =========================================
   HEADER
========================================= */

.header {
  height: 68px;
  padding: 0 22px;

  display: flex;
  align-items: center;
  justify-content: space-between;

  background: rgba(247,248,250,.88);

  border-bottom:
    1px solid rgba(255,255,255,.9);

  box-shadow:
    0 4px 14px rgba(0,0,0,.045),
    inset 0 -1px 0 rgba(255,255,255,.9);

  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);

  z-index: 10;
}


/* =========================================
   LOGO
========================================= */

.logo {
  display: flex;
  align-items: center;
  gap: 11px;

  font-size: 15px;
  font-weight: 800;
  letter-spacing: 1.8px;
}

.logo-icon {
  width: 36px;
  height: 36px;

  border-radius: 11px;

  display: flex;
  align-items: center;
  justify-content: center;

  color: white;
  font-size: 15px;
  font-weight: 800;

  background:
    linear-gradient(
      145deg,
      #897cff,
      #5c4df0
    );

  box-shadow:
    4px 4px 9px rgba(50,40,150,.18),
    -4px -4px 9px rgba(255,255,255,.95);

  text-shadow:
    0 1px 2px rgba(0,0,0,.2);
}


/* =========================================
   STATUS
========================================= */

.status {
  font-size: 12px;
  font-weight: 600;
  color: #45a86b;

  padding: 7px 11px;

  border-radius: 10px;

  background: #f1f3f5;

  box-shadow:
    inset 2px 2px 5px rgba(0,0,0,.055),
    inset -2px -2px 5px rgba(255,255,255,.95);
}


/* =========================================
   CHAT AREA
========================================= */

.chat {
  flex: 1;

  overflow-y: auto;

  padding:
    35px 18px
    130px;

  scroll-behavior: smooth;
}


/* scrollbar */

.chat::-webkit-scrollbar {
  width: 7px;
}

.chat::-webkit-scrollbar-track {
  background: transparent;
}

.chat::-webkit-scrollbar-thumb {
  background: #d7d9de;
  border-radius: 20px;
}

.chat::-webkit-scrollbar-thumb:hover {
  background: #c5c8ce;
}


/* =========================================
   WELCOME
========================================= */

.welcome {
  text-align: center;

  margin:
    75px auto
    35px;

  max-width: 600px;

  animation:
    welcomeIn .5s ease;
}

@keyframes welcomeIn {

  from {
    opacity: 0;
    transform: translateY(15px);
  }

  to {
    opacity: 1;
    transform: translateY(0);
  }

}


.welcome-icon {
  width: 76px;
  height: 76px;

  margin: auto;

  border-radius: 23px;

  display: flex;
  align-items: center;
  justify-content: center;

  color: white;

  font-size: 34px;

  background:
    linear-gradient(
      145deg,
      #8b7cff,
      #6252ee
    );

  box-shadow:
    10px 10px 22px rgba(55,45,170,.20),
    -10px -10px 22px rgba(255,255,255,.95);

  text-shadow:
    0 2px 4px rgba(0,0,0,.15);
}


.welcome h1 {
  font-size: 30px;

  margin:
    22px 0 9px;

  letter-spacing: -.7px;

  color: #202124;
}


.welcome p {
  margin: 0;

  color: #888c94;

  font-size: 14px;
}


.creator {
  margin-top: 18px;

  font-size: 11px;

  color: #a0a3aa;

  letter-spacing: .6px;
}


/* =========================================
   MESSAGES
========================================= */

.message {
  max-width: 780px;

  margin:
    0 auto
    18px;

  display: flex;

  animation:
    messageIn .25s ease;
}

@keyframes messageIn {

  from {
    opacity: 0;
    transform: translateY(7px);
  }

  to {
    opacity: 1;
    transform: translateY(0);
  }

}


.message.user {
  justify-content: flex-end;
}

.message.bot {
  justify-content: flex-start;
}


/* =========================================
   BUBBLES
========================================= */

.bubble {
  max-width: 82%;

  padding:
    13px 16px;

  border-radius: 18px;

  line-height: 1.65;

  font-size: 15px;

  overflow-wrap: break-word;

  transition:
    transform .15s ease;
}


/* USER */

.user .bubble {

  color: white;

  background:
    linear-gradient(
      145deg,
      #8071ff,
      #6252ed
    );

  border-bottom-right-radius: 6px;

  white-space: pre-wrap;

  box-shadow:
    6px 7px 15px rgba(72,58,190,.22),
    -3px -3px 8px rgba(255,255,255,.55);

}


/* BOT */

.bot .bubble {

  color: #34363a;

  background:
    linear-gradient(
      145deg,
      #f9fafb,
      #eceef1
    );

  border:
    1px solid rgba(255,255,255,.85);

  border-bottom-left-radius: 6px;

  box-shadow:
    7px 7px 15px rgba(0,0,0,.08),
    -7px -7px 15px rgba(255,255,255,.95);

}


/* =========================================
   MARKDOWN
========================================= */

.bot strong {
  font-weight: 700;
  color: #24262a;
}

.bot em {
  font-style: italic;
}

.bot code {

  background: #e6e8ec;

  color: #575a62;

  padding:
    2px 6px;

  border-radius: 6px;

  font-family:
    "SFMono-Regular",
    Consolas,
    monospace;

  font-size: 13px;

  box-shadow:
    inset 1px 1px 3px rgba(0,0,0,.08),
    inset -1px -1px 3px rgba(255,255,255,.8);
}


.bot pre {

  background: #e7e9ed;

  padding: 14px;

  border-radius: 12px;

  overflow-x: auto;

  box-shadow:
    inset 3px 3px 7px rgba(0,0,0,.07),
    inset -3px -3px 7px rgba(255,255,255,.9);
}


.bot pre code {

  padding: 0;

  background: transparent;

  box-shadow: none;
}


/* =========================================
   INPUT AREA
========================================= */

.input-area {

  position: fixed;

  left: 0;
  right: 0;
  bottom: 0;

  padding:
    15px 16px
    20px;

  background:
    linear-gradient(
      to top,
      rgba(243,244,246,.98),
      rgba(243,244,246,.82),
      transparent
    );

  z-index: 20;
}


/* =========================================
   INPUT BOX — EMBOSSED
========================================= */

.input-box {

  max-width: 780px;

  margin: auto;

  display: flex;

  gap: 9px;

  padding: 7px;

  border-radius: 19px;

  background:
    linear-gradient(
      145deg,
      #eef0f3,
      #fafbfc
    );

  border:
    1px solid rgba(255,255,255,.95);

  box-shadow:
    8px 8px 18px rgba(0,0,0,.09),
    -8px -8px 18px rgba(255,255,255,.98);

  transition:
    box-shadow .2s ease,
    transform .2s ease;
}


.input-box:focus-within {

  transform:
    translateY(-1px);

  box-shadow:
    10px 10px 22px rgba(0,0,0,.10),
    -10px -10px 22px rgba(255,255,255,1),
    inset 1px 1px 3px rgba(0,0,0,.03);
}


/* =========================================
   INPUT
========================================= */

#messageInput {

  flex: 1;

  min-width: 0;

  border: 0;

  outline: 0;

  background: transparent;

  color: #292b30;

  padding:
    12px;

  font-size: 15px;

  font-family: inherit;
}


#messageInput::placeholder {
  color: #999da5;
}


/* =========================================
   SEND BUTTON
========================================= */

#sendButton {

  width: 44px;
  height: 44px;

  border: 0;

  border-radius: 13px;

  background:
    linear-gradient(
      145deg,
      #8172ff,
      #5e4fee
    );

  color: white;

  font-size: 20px;

  cursor: pointer;

  flex-shrink: 0;

  box-shadow:
    4px 5px 10px rgba(68,55,180,.25),
    -3px -3px 7px rgba(255,255,255,.6);

  transition:
    transform .12s ease,
    box-shadow .12s ease;
}


#sendButton:hover {

  transform:
    translateY(-1px);

  box-shadow:
    5px 6px 12px rgba(68,55,180,.30),
    -3px -3px 7px rgba(255,255,255,.7);
}


#sendButton:active {

  transform:
    translateY(2px)
    scale(.94);

  box-shadow:
    inset 3px 3px 6px rgba(40,30,130,.3);
}


#sendButton:disabled {
  opacity: .45;
  cursor: default;
}


/* =========================================
   NEW CHAT BUTTON
========================================= */

#newChatButton {

  border:
    1px solid rgba(255,255,255,.9);

  background:
    linear-gradient(
      145deg,
      #eef0f3,
      #fafbfc
    );

  color: #777b83;

  padding:
    8px 12px;

  border-radius: 10px;

  cursor: pointer;

  font-size: 12px;

  font-weight: 600;

  box-shadow:
    4px 4px 9px rgba(0,0,0,.07),
    -4px -4px 9px rgba(255,255,255,.95);

  transition:
    all .15s ease;
}


#newChatButton:hover {

  color: #5e4fee;

  transform:
    translateY(-1px);
}


#newChatButton:active {

  transform:
    translateY(1px);

  box-shadow:
    inset 2px 2px 5px rgba(0,0,0,.08),
    inset -2px -2px 5px rgba(255,255,255,.9);
}


/* =========================================
   MOBILE
========================================= */

@media (max-width: 600px) {

  .header {
    height: 62px;
    padding: 0 14px;
  }

  .status {
    display: none;
  }

  .logo {
    font-size: 14px;
  }

  .logo-icon {
    width: 34px;
    height: 34px;
  }

  .chat {
    padding:
      25px 13px
      120px;
  }

  .welcome {
    margin:
      65px auto
      30px;
  }

  .welcome-icon {
    width: 68px;
    height: 68px;
    border-radius: 20px;
  }

  .welcome h1 {
    font-size: 25px;
  }

  .bubble {
    max-width: 90%;
    font-size: 14px;
  }

  .input-area {
    padding:
      10px 10px

  }

  .input-box {
    border-radius: 17px;
  }

  #messageInput {
    padding: 10px;
    font-size: 14px;
  }

  #sendButton {
    width: 42px;
    height: 42px;
  }

  #newChatButton {
    padding:
      7px 9px;
  }

}


/* =========================================
   EXTRA EMBOSSED LIGHT
========================================= */

.header::after {

  content: "";

  position: absolute;

  left: 0;
  right: 0;
  bottom: -1px;

  height: 1px;

  background:
    linear-gradient(
      90deg,
      transparent,
      rgba(255,255,255,.95),
      transparent
    );
}

</style>
</head>


<body>

<div class="app">


  <!-- HEADER -->

  <div class="header">

    <div class="logo">

      <div class="logo-icon">
        V
      </div>

      <span>
        VIXORA
      </span>

    </div>


    <div
      style="
        display:flex;
        align-items:center;
        gap:10px;
      "
    >

      <div class="status">
        ● AI Online
      </div>

      <button
        id="newChatButton"
        onclick="newChat()"
      >
        + New Chat
      </button>

    </div>

  </div>


  <!-- CHAT -->

  <div
    class="chat"
    id="chat"
  >

    <div
      class="welcome"
      id="welcome"
    >

      <div class="welcome-icon">
        ✦
      </div>

      <h1>
        Halo, aku Vixora 👋
      </h1>

      <p>
        Your AI. Your Way.
      </p>

      <div class="creator">
        Crafted by Viqi
      </div>

    </div>

  </div>


  <!-- INPUT -->

  <div class="input-area">

    <div class="input-box">

      <input
        id="messageInput"
        type="text"
        placeholder="Tanya sesuatu ke Vixora..."
        autocomplete="off"
      >

      <button
        id="sendButton"
        onclick="sendMessage()"
      >
        ↑
      </button>

    </div>

  </div>

</div>


<script>

/* =================================
   VIXORA WORKER
================================= */

const API =
  "https://black-limit-8938.viqiquotex.workers.dev/";


/* =================================
   MARKDOWN SEDERHANA
================================= */

function formatText(text) {

  let html = text;

  html = html
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");

  html = html.replace(
    /```([\s\S]*?)```/g,
    "<pre><code>$1</code></pre>"
  );

  html = html.replace(
    /`([^`]+)`/g,
    "<code>$1</code>"
  );

  html = html.replace(
    /\*\*(.*?)\*\*/g,
    "<strong>$1</strong>"
  );

  html = html.replace(
    /\*([^*]+)\*/g,
    "<em>$1</em>"
  );

  html = html.replace(
    /\n/g,
    "<br>"
  );

  return html;
}


/* =================================
   ADD MESSAGE
================================= */

function addMessage(text, type) {

  const message =
    document.createElement("div");

  message.className =
    "message " + type;

  const bubble =
    document.createElement("div");

  bubble.className =
    "bubble";

  if (type === "bot") {

    bubble.innerHTML =
      formatText(text);

  } else {

    bubble.textContent =
      text;

  }

  message.appendChild(bubble);

  document
    .getElementById("chat")
    .appendChild(message);

  scrollBottom();
}


/* =================================
   SEND MESSAGE
================================= */

async function sendMessage() {

  const input =
    document.getElementById(
      "messageInput"
    );

  const button =
    document.getElementById(
      "sendButton"
    );

  const message =
    input.value.trim();

  if (!message) {
    return;
  }


  /* HILANGKAN WELCOME */

  const welcome =
    document.getElementById(
      "welcome"
    );

  if (welcome) {
    welcome.remove();
  }


  /* PESAN USER */

  addMessage(
    message,
    "user"
  );

  input.value = "";

  button.disabled = true;


  /* THINKING */

  const thinking =
    document.createElement("div");

  thinking.className =
    "message bot";

  thinking.innerHTML = `
    <div class="bubble">
      Vixora sedang berpikir...
    </div>
  `;

  document
    .getElementById("chat")
    .appendChild(thinking);

  scrollBottom();


  try {

    /* REQUEST KE WORKER */

    const response =
      await fetch(
        API,
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body: JSON.stringify({
            message: message
          })
        }
      );


    /* ERROR RESPONSE */

    if (!response.ok) {

      let errorMessage =
        "Vixora gagal terhubung ke server.";

      try {

        const errorData =
          await response.json();

        if (errorData.error) {

          errorMessage =
            errorData.error;

        }

      } catch {

        errorMessage =
          "Server mengembalikan error HTTP " +
          response.status;

      }

      throw new Error(
        errorMessage
      );
    }


    /* HAPUS THINKING */

    thinking.remove();


    /* BOT MESSAGE */

    const botMessage =
      document.createElement(
        "div"
      );

    botMessage.className =
      "message bot";


    const bubble =
      document.createElement(
        "div"
      );

    bubble.className =
      "bubble";


    botMessage.appendChild(
      bubble
    );


    document
      .getElementById("chat")
      .appendChild(
        botMessage
      );


    /* STREAMING RESPONSE */

    if (
      response.body &&
      response.body.getReader
    ) {

      const reader =
        response.body.getReader();

      const decoder =
        new TextDecoder();

      let answer = "";


      while (true) {

        const result =
          await reader.read();

        if (result.done) {
          break;
        }

        answer +=
          decoder.decode(
            result.value,
            {
              stream: true
            }
          );

        bubble.innerHTML =
          formatText(answer);

        scrollBottom();
      }


      /* FLUSH DECODER */

      answer +=
        decoder.decode();

      bubble.innerHTML =
        formatText(answer);

    } else {

      const answer =
        await response.text();

      bubble.innerHTML =
        formatText(answer);

    }

  } catch (error) {

    console.error(
      "VIXORA ERROR:",
      error
    );


    thinking.remove();


    /* ERROR MESSAGE */

    addMessage(
      error.message ||
      "Vixora sedang mengalami masalah koneksi 😭",
      "bot"
    );

  }


  button.disabled = false;

  input.focus();
}


/* =================================
   ENTER
================================= */

document
  .getElementById(
    "messageInput"
  )
  .addEventListener(
    "keydown",
    function(event) {

      if (
        event.key === "Enter"
      ) {

        event.preventDefault();

        sendMessage();

      }

    }
  );


/* =================================
   NEW CHAT
================================= */

function newChat() {

  document
    .getElementById("chat")
    .innerHTML = `

      <div
        class="welcome"
        id="welcome"
      >

        <div class="welcome-icon">
          ✦
        </div>

        <h1>
          Halo, aku Vixora 👋
        </h1>

        <p>
          Your AI. Your Way.
        </p>

        <div class="creator">
          Crafted by Viqi
        </div>

      </div>

  `;

  document
    .getElementById(
      "messageInput"
    )
    .focus();
}


/* =================================
   SCROLL
================================= */

function scrollBottom() {

  const chat =
    document.getElementById(
      "chat"
    );

  chat.scrollTop =
    chat.scrollHeight;
}

</script>

</body>
</html>
````
