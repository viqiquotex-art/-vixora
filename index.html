<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b0b0f">

<title>VIXORA</title>

<style>

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

  background: #0b0b0f;
  color: #ffffff;

  height: 100vh;
  overflow: hidden;
}

.app {
  height: 100vh;
  display: flex;
  flex-direction: column;
}

/* HEADER */

.header {
  height: 64px;

  display: flex;
  align-items: center;
  justify-content: space-between;

  padding: 0 18px;

  border-bottom: 1px solid #222228;

  background: #0b0b0f;

  flex-shrink: 0;
}

.logo {
  display: flex;
  align-items: center;
  gap: 10px;
}

.logo-icon {
  width: 34px;
  height: 34px;

  border-radius: 10px;

  display: flex;
  align-items: center;
  justify-content: center;

  background:
    linear-gradient(
      135deg,
      #8b5cf6,
      #6366f1
    );

  font-weight: 800;
}

.logo-text {
  font-size: 18px;
  font-weight: 700;
  letter-spacing: 1px;
}

.header-right {
  display: flex;
  align-items: center;
  gap: 10px;
}

.status {
  font-size: 12px;
  color: #8f8f9a;
}

.status-dot {
  color: #4ade80;
}

.new-chat {
  border: 1px solid #292932;

  background: #17171d;

  color: #aaaab5;

  padding: 8px 12px;

  border-radius: 10px;

  cursor: pointer;

  font-size: 12px;
}

/* CHAT */

.chat {
  flex: 1;

  overflow-y: auto;

  padding:
    25px
    18px
    120px;
}

.message {
  max-width: 760px;

  margin:
    0 auto
    20px;

  display: flex;
}

.message.user {
  justify-content: flex-end;
}

.message.bot {
  justify-content: flex-start;
}

.bubble {
  max-width: 85%;

  padding:
    13px
    16px;

  border-radius: 18px;

  font-size: 15px;

  line-height: 1.65;

  overflow-wrap: break-word;
}

.user .bubble {
  background:
    linear-gradient(
      135deg,
      #7c3aed,
      #6366f1
    );

  border-bottom-right-radius: 5px;

  white-space: pre-wrap;
}

.bot .bubble {
  background: #17171d;

  border: 1px solid #25252d;

  border-bottom-left-radius: 5px;
}

/* MARKDOWN */

.bot .bubble strong {
  font-weight: 700;
}

.bot .bubble em {
  font-style: italic;
}

.bot .bubble code {
  background: #0d0d12;

  border: 1px solid #292932;

  border-radius: 6px;

  padding: 2px 5px;

  font-family: monospace;

  font-size: 13px;
}

.bot .bubble pre {
  background: #0d0d12;

  border: 1px solid #292932;

  border-radius: 10px;

  padding: 12px;

  margin: 10px 0;

  overflow-x: auto;
}

.bot .bubble pre code {
  border: none;

  padding: 0;

  background: transparent;

  color: #eeeeee;
}

.bot .bubble ul {
  margin-left: 20px;

  margin-top: 7px;
}

.bot .bubble li {
  margin-bottom: 5px;
}

/* WELCOME */

.welcome {
  max-width: 700px;

  margin:
    70px
    auto
    30px;

  text-align: center;
}

.welcome-icon {
  width: 64px;
  height: 64px;

  margin: auto;

  border-radius: 20px;

  display: flex;
  align-items: center;
  justify-content: center;

  font-size: 28px;

  background:
    linear-gradient(
      135deg,
      #8b5cf6,
      #6366f1
    );
}

.welcome h1 {
  margin-top: 20px;

  font-size: 30px;
}

.welcome p {
  margin-top: 10px;

  color: #888894;
}

.creator {
  margin-top: 18px;

  font-size: 12px;

  color: #666673;
}

/* THINKING */

.thinking {
  display: flex;

  gap: 4px;
}

.dot {
  width: 5px;
  height: 5px;

  background: #888;

  border-radius: 50%;

  animation:
    blink 1.2s infinite;
}

.dot:nth-child(2) {
  animation-delay: .2s;
}

.dot:nth-child(3) {
  animation-delay: .4s;
}

@keyframes blink {

  0%, 100% {
    opacity: .2;
  }

  50% {
    opacity: 1;
  }

}

/* STREAM CURSOR */

.streaming::after {
  content: "▋";

  animation:
    cursorBlink .8s infinite;
}

@keyframes cursorBlink {

  0%, 50% {
    opacity: 1;
  }

  51%, 100% {
    opacity: 0;
  }

}

/* INPUT */

.input-container {
  position: fixed;

  bottom: 0;

  left: 0;
  right: 0;

  padding:
    12px
    15px
    18px;

  background:
    linear-gradient(
      transparent,
      #0b0b0f 30%
    );
}

.input-box {
  max-width: 760px;

  margin: auto;

  display: flex;

  gap: 8px;

  padding: 7px;

  background: #17171d;

  border: 1px solid #292932;

  border-radius: 18px;
}

.input-box input {
  flex: 1;

  border: none;

  outline: none;

  background: transparent;

  color: white;

  padding: 12px;

  font-size: 15px;
}

.input-box input::placeholder {
  color: #686873;
}

.send {
  width: 42px;
  height: 42px;

  border: none;

  border-radius: 13px;

  background:
    linear-gradient(
      135deg,
      #8b5cf6,
      #6366f1
    );

  color: white;

  font-size: 18px;

  cursor: pointer;
}

.send:disabled {
  opacity: .5;
}

@media (max-width: 600px) {

  .welcome {
    margin-top: 50px;
  }

  .welcome h1 {
    font-size: 26px;
  }

  .status {
    display: none;
  }

  .bubble {
    max-width: 88%;
  }

}

</style>
</head>


<body>

<div class="app">

  <!-- HEADER -->

  <header class="header">

    <div class="logo">

      <div class="logo-icon">
        V
      </div>

      <div class="logo-text">
        VIXORA
      </div>

    </div>

    <div class="header-right">

      <div class="status">

        <span class="status-dot">
          ●
        </span>

        AI Online

      </div>

      <button
        class="new-chat"
        id="newChatButton"
      >
        + New Chat
      </button>

    </div>

  </header>


  <!-- CHAT -->

  <main
    class="chat"
    id="chat"
  >

    <div
      class="welcome"
      id="welcome"
    >

      <div class="welcome-icon">
        ✦
      </div>

      <h1>
        Halo, aku Vixora 👋
      </h1>

      <p>
        Your AI. Your Way.
      </p>

      <div class="creator">
        Crafted by Viqi
      </div>

    </div>

  </main>


  <!-- INPUT -->

  <div class="input-container">

    <div class="input-box">

      <input
        id="messageInput"
        type="text"
        placeholder="Tanya sesuatu ke Vixora..."
        autocomplete="off"
      >

      <button
        class="send"
        id="sendButton"
      >
        ↑
      </button>

    </div>

  </div>

</div>


<script>

/* =========================
   API
========================= */

const VIXORA_API =
  "https://black-limit-8938.viqiquotex.workers.dev/";


/* =========================
   ELEMENTS
========================= */

const chat =
  document.getElementById(
    "chat"
  );

const input =
  document.getElementById(
    "messageInput"
  );

const sendButton =
  document.getElementById(
    "sendButton"
  );

const newChatButton =
  document.getElementById(
    "newChatButton"
  );


/* =========================
   MARKDOWN
========================= */

function markdown(text) {

  let value = text;

  /*
    Escape HTML
  */

  value =
    value
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;");


  /*
    Code block
  */

  value =
    value.replace(
      /```([\s\S]*?)```/g,
      function(_, code) {

        return (
          "<pre><code>" +
          code.trim() +
          "</code></pre>"
        );

      }
    );


  /*
    Inline code
  */

  value =
    value.replace(
      /`([^`]+)`/g,
      "<code>$1</code>"
    );


  /*
    Bold
  */

  value =
    value.replace(
      /\*\*(.*?)\*\*/g,
      "<strong>$1</strong>"
    );


  /*
    Italic
  */

  value =
    value.replace(
      /(^|[^*])\*([^*]+)\*(?!\*)/g,
      "$1<em>$2</em>"
    );


  /*
    Bullet
  */

  value =
    value.replace(
      /(^|\n)[-*] (.*)/g,
      "$1• $2"
    );


  /*
    New line
  */

  value =
    value.replace(
      /\n/g,
      "<br>"
    );


  return value;
}


/* =========================
   ADD MESSAGE
========================= */

function addMessage(
  text,
  type
) {

  const message =
    document.createElement(
      "div"
    );

  message.className =
    "message " + type;


  const bubble =
    document.createElement(
      "div"
    );

  bubble.className =
    "bubble";


  if (type === "bot") {

    bubble.innerHTML =
      markdown(text);

  } else {

    bubble.textContent =
      text;

  }


  message.appendChild(
    bubble
  );

  chat.appendChild(
    message
  );


  scrollBottom();
}


/* =========================
   SEND
========================= */

async function sendMessage() {

  const message =
    input.value.trim();


  if (!message) {
    return;
  }


  /*
    Hide welcome
  */

  const welcome =
    document.getElementById(
      "welcome"
    );

  if (welcome) {
    welcome.remove();
  }


  /*
    User message
  */

  addMessage(
    message,
    "user"
  );


  input.value = "";

  sendButton.disabled =
    true;


  /*
    Thinking
  */

  const thinking =
    document.createElement(
      "div"
    );

  thinking.className =
    "message bot";


  thinking.innerHTML = `

    <div class="bubble thinking">

      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>

    </div>

  `;


  chat.appendChild(
    thinking
  );


  scrollBottom();


  try {

    /*
      Request Worker
    */

    const response =
      await fetch(
        VIXORA_API,
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({
              message: message
            })
        }
      );


    if (!response.ok) {

      const error =
        await response.text();

      throw new Error(
        error ||
        "Server error"
      );

    }


    /*
      Remove thinking
    */

    thinking.remove();


    /*
      Bot bubble
    */

    const botMessage =
      document.createElement(
        "div"
      );

    botMessage.className =
      "message bot";


    const botBubble =
      document.createElement(
        "div"
      );

    botBubble.className =
      "bubble streaming";


    botMessage.appendChild(
      botBubble
    );


    chat.appendChild(
      botMessage
    );


    /*
      Streaming reader
    */

    const reader =
      response.body.getReader();


    const decoder =
      new TextDecoder(
        "utf-8"
      );


    let fullText = "";


    while (true) {

      const result =
        await reader.read();


      if (result.done) {
        break;
      }


      const chunk =
        decoder.decode(
          result.value,
          {
            stream: true
          }
        );


      fullText +=
        chunk;


      /*
        Render
      */

      botBubble.innerHTML =
        markdown(
          fullText
        );


      scrollBottom();

    }


    /*
      Final
    */

    botBubble.innerHTML =
      markdown(
        fullText
      );


    botBubble.classList.remove(
      "streaming"
    );


  } catch (error) {

    console.error(
      "Vixora:",
      error
    );


    if (
      thinking.parentNode
    ) {
      thinking.remove();
    }


    addMessage(
      "Vixora sedang mengalami masalah koneksi 😭",
      "bot"
    );

  }


  sendButton.disabled =
    false;

  input.focus();

}


/* =========================
   ENTER
========================= */

input.addEventListener(
  "keydown",
  function(event) {

    if (
      event.key === "Enter"
    ) {

      event.preventDefault();

      sendMessage();

    }

  }
);


/* =========================
   NEW CHAT
========================= */

newChatButton.addEventListener(
  "click",
  function() {

    chat.innerHTML = `

      <div
        class="welcome"
        id="welcome"
      >

        <div class="welcome-icon">
          ✦
        </div>

        <h1>
          Halo, aku Vixora 👋
        </h1>

        <p>
          Your AI. Your Way.
        </p>

        <div class="creator">
          Crafted by Viqi
        </div>

      </div>

    `;

    input.focus();

  }
);


/* =========================
   SCROLL
========================= */

function scrollBottom() {

  chat.scrollTop =
    chat.scrollHeight;

}

</script>

</body>
</html>
