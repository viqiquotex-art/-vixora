<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b0b0f">

<title>VIXORA</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

  background: #0b0b0f;
  color: #ffffff;

  height: 100vh;
  overflow: hidden;
}

.app {
  height: 100vh;
  display: flex;
  flex-direction: column;
}

/* HEADER */

.header {
  height: 64px;
  display: flex;
  align-items: center;
  justify-content: space-between;

  padding: 0 18px;

  border-bottom: 1px solid #222228;
  background: rgba(11,11,15,.96);

  flex-shrink: 0;
}

.logo {
  display: flex;
  align-items: center;
  gap: 10px;
}

.logo-icon {
  width: 34px;
  height: 34px;

  border-radius: 10px;

  display: flex;
  align-items: center;
  justify-content: center;

  background: linear-gradient(
    135deg,
    #8b5cf6,
    #6366f1
  );

  font-weight: 800;
}

.logo-text {
  font-size: 18px;
  font-weight: 700;
  letter-spacing: 1px;
}

.header-right {
  display: flex;
  align-items: center;
  gap: 10px;
}

.status {
  font-size: 12px;
  color: #8f8f9a;
}

.status-dot {
  color: #4ade80;
}

.new-chat {
  border: 1px solid #292932;
  background: #17171d;
  color: #aaaab5;

  padding: 8px 12px;

  border-radius: 10px;

  cursor: pointer;

  font-size: 12px;
}

.new-chat:hover {
  background: #202027;
}

/* CHAT */

.chat {
  flex: 1;
  overflow-y: auto;

  padding:
    24px
    18px
    120px;

  scroll-behavior: smooth;
}

.chat::-webkit-scrollbar {
  width: 5px;
}

.chat::-webkit-scrollbar-thumb {
  background: #292932;
  border-radius: 10px;
}

/* WELCOME */

.welcome {
  max-width: 700px;

  margin:
    70px
    auto
    30px;

  text-align: center;
}

.welcome-icon {
  width: 64px;
  height: 64px;

  margin: auto;

  border-radius: 20px;

  display: flex;
  align-items: center;
  justify-content: center;

  font-size: 28px;

  background: linear-gradient(
    135deg,
    #8b5cf6,
    #6366f1
  );

  box-shadow:
    0 0 35px
    rgba(139,92,246,.25);
}

.welcome h1 {
  margin-top: 20px;
  font-size: 30px;
}

.welcome p {
  margin-top: 10px;
  color: #888894;
}

.creator {
  margin-top: 18px;

  font-size: 12px;

  color: #666673;

  letter-spacing: .5px;
}

/* MESSAGE */

.message {
  max-width: 760px;

  margin:
    0 auto
    20px;

  display: flex;
}

.message.user {
  justify-content: flex-end;
}

.message.bot {
  justify-content: flex-start;
}

.bubble {
  max-width: 82%;

  padding:
    13px
    16px;

  border-radius: 18px;

  line-height: 1.65;

  font-size: 15px;

  overflow-wrap: break-word;
}

.user .bubble {
  background: linear-gradient(
    135deg,
    #7c3aed,
    #6366f1
  );

  border-bottom-right-radius: 5px;

  white-space: pre-wrap;
}

.bot .bubble {
  background: #17171d;

  border: 1px solid #25252d;

  border-bottom-left-radius: 5px;
}

/* MARKDOWN */

.bot .bubble p {
  margin-bottom: 10px;
}

.bot .bubble p:last-child {
  margin-bottom: 0;
}

.bot .bubble strong {
  font-weight: 700;
  color: #ffffff;
}

.bot .bubble em {
  font-style: italic;
  color: #d5d5df;
}

.bot .bubble h1,
.bot .bubble h2,
.bot .bubble h3 {
  margin:
    8px
    0
    10px;

  line-height: 1.3;
}

.bot .bubble h1 {
  font-size: 21px;
}

.bot .bubble h2 {
  font-size: 19px;
}

.bot .bubble h3 {
  font-size: 17px;
}

.bot .bubble ul,
.bot .bubble ol {
  margin:
    8px
    0
    10px
    20px;
}

.bot .bubble li {
  margin-bottom: 5px;
}

.bot .bubble code {
  background: #0d0d12;

  border: 1px solid #292932;

  padding:
    2px
    6px;

  border-radius: 6px;

  font-family:
    SFMono-Regular,
    Consolas,
    monospace;

  font-size: 13px;

  color: #d8b4fe;
}

.bot .bubble pre {
  background: #0d0d12;

  border: 1px solid #292932;

  border-radius: 10px;

  padding: 13px;

  margin:
    10px
    0;

  overflow-x: auto;
}

.bot .bubble pre code {
  background: transparent;
  border: none;
  padding: 0;

  color: #e5e7eb;

  white-space: pre;
}

.bot .bubble a {
  color: #a78bfa;
  text-decoration: none;
}

.bot .bubble a:hover {
  text-decoration: underline;
}

/* STREAMING CURSOR */

.streaming-cursor::after {
  content: "▋";

  display: inline-block;

  margin-left: 2px;

  animation:
    cursorBlink
    .8s infinite;
}

@keyframes cursorBlink {
  0%, 50% {
    opacity: 1;
  }

  51%, 100% {
    opacity: 0;
  }
}

/* THINKING */

.thinking {
  display: flex;

  gap: 4px;

  align-items: center;
}

.dot {
  width: 5px;
  height: 5px;

  background: #888;

  border-radius: 50%;

  animation:
    blink
    1.2s infinite;
}

.dot:nth-child(2) {
  animation-delay: .2s;
}

.dot:nth-child(3) {
  animation-delay: .4s;
}

@keyframes blink {
  0%, 100% {
    opacity: .2;
  }

  50% {
    opacity: 1;
  }
}

/* INPUT */

.input-container {
  position: fixed;

  bottom: 0;

  left: 0;
  right: 0;

  padding:
    12px
    15px
    18px;

  background:
    linear-gradient(
      transparent,
      #0b0b0f 30%
    );
}

.input-box {
  max-width: 760px;

  margin: auto;

  display: flex;

  align-items: center;

  gap: 8px;

  padding: 7px;

  background: #17171d;

  border: 1px solid #292932;

  border-radius: 18px;

  box-shadow:
    0 10px 40px
    rgba(0,0,0,.35);
}

.input-box input {
  flex: 1;

  border: none;
  outline: none;

  background: transparent;

  color: white;

  padding: 12px;

  font-size: 15px;
}

.input-box input::placeholder {
  color: #686873;
}

.send {
  width: 42px;
  height: 42px;

  border: none;

  border-radius: 13px;

  background:
    linear-gradient(
      135deg,
      #8b5cf6,
      #6366f1
    );

  color: white;

  font-size: 18px;

  cursor: pointer;
}

.send:active {
  transform: scale(.94);
}

.send:disabled {
  opacity: .5;
  cursor: not-allowed;
}

/* MOBILE */

@media (max-width: 600px) {

  .welcome {
    margin-top: 50px;
  }

  .welcome h1 {
    font-size: 26px;
  }

  .bubble {
    max-width: 88%;
  }

  .status {
    display: none;
  }

  .header {
    padding: 0 12px;
  }
}

@media (min-width: 601px) {

  .input-container {
    padding-bottom: 22px;
  }

}
</style>

</head>

<body>

<div class="app">

  <!-- HEADER -->

  <header class="header">

    <div class="logo">

      <div class="logo-icon">
        V
      </div>

      <div class="logo-text">
        VIXORA
      </div>

    </div>

    <div class="header-right">

      <div class="status">

        <span class="status-dot">
          ●
        </span>

        AI Online

      </div>

      <button
        class="new-chat"
        onclick="newChat()"
      >
        + New Chat
      </button>

    </div>

  </header>


  <!-- CHAT -->

  <main
    class="chat"
    id="chat"
  >

    <div
      class="welcome"
      id="welcome"
    >

      <div class="welcome-icon">
        ✦
      </div>

      <h1>
        Halo, aku Vixora 👋
      </h1>

      <p>
        Your AI. Your Way.
      </p>

      <div class="creator">
        Crafted by Viqi
      </div>

    </div>

  </main>


  <!-- INPUT -->

  <div class="input-container">

    <div class="input-box">

      <input
        id="messageInput"
        type="text"
        placeholder="Tanya sesuatu ke Vixora..."
        autocomplete="off"
      >

      <button
        class="send"
        id="sendButton"
        onclick="sendMessage()"
      >
        ↑
      </button>

    </div>

  </div>

</div>


<script>

/* =========================
   VIXORA API
========================= */

const VIXORA_API =
  "https://black-limit-8938.viqiquotex.workers.dev/";


/* =========================
   MARKDOWN RENDERER
========================= */

function renderMarkdown(text) {

  let html = text;

  // Escape HTML
  html = html
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");

  // Code blocks
  html = html.replace(
    /```([\s\S]*?)```/g,
    function(match, code) {

      return "<pre><code>" +
        code.trim() +
        "</code></pre>";

    }
  );

  // Inline code
  html = html.replace(
    /`([^`]+)`/g,
    "<code>$1</code>"
  );

  // Headings
  html = html.replace(
    /^### (.*)$/gm,
    "<h3>$1</h3>"
  );

  html = html.replace(
    /^## (.*)$/gm,
    "<h2>$1</h2>"
  );

  html = html.replace(
    /^# (.*)$/gm,
    "<h1>$1</h1>"
  );

  // Bold
  html = html.replace(
    /\*\*(.*?)\*\*/g,
    "<strong>$1</strong>"
  );

  // Italic
  html = html.replace(
    /(?<!\*)\*([^*]+)\*(?!\*)/g,
    "<em>$1</em>"
  );

  // Links
  html = html.replace(
    /$begin:math:display$\(\[\^$end:math:display$]+)\]$begin:math:text$\(https\?\:\\\/\\\/\[\^\\s\)\]\+\)$end:math:text$/g,
    '<a href="$2" target="_blank" rel="noopener">$1</a>'
  );

  // Bullet list
  html = html.replace(
    /(?:^|\n)((?:[-*] .+(?:\n|$))+)/g,
    function(match, list) {

      const items =
        list
          .trim()
          .split("\n")
          .map(
            item =>
              "<li>" +
              item.replace(/^[-*] /, "") +
              "</li>"
          )
          .join("");

      return "\n<ul>" +
        items +
        "</ul>\n";

    }
  );

  // Numbered list
  html = html.replace(
    /(?:^|\n)((?:\d+\. .+(?:\n|$))+)/g,
    function(match, list) {

      const items =
        list
          .trim()
          .split("\n")
          .map(
            item =>
              "<li>" +
              item.replace(/^\d+\. /, "") +
              "</li>"
          )
          .join("");

      return "\n<ol>" +
        items +
        "</ol>\n";

    }
  );

  // Paragraphs
  html = html
    .split(/\n{2,}/)
    .map(
      block => {

        if (
          block.startsWith("<h1>") ||
          block.startsWith("<h2>") ||
          block.startsWith("<h3>") ||
          block.startsWith("<ul>") ||
          block.startsWith("<ol>") ||
          block.startsWith("<pre>")
        ) {
          return block;
        }

        return "<p>" +
          block.replace(/\n/g, "<br>") +
          "</p>";

      }
    )
    .join("");

  return html;
}


/* =========================
   SEND MESSAGE
========================= */

async function sendMessage() {

  const input =
    document.getElementById(
      "messageInput"
    );

  const sendButton =
    document.getElementById(
      "sendButton"
    );

  const chat =
    document.getElementById(
      "chat"
    );

  const welcome =
    document.getElementById(
      "welcome"
    );


  const message =
    input.value.trim();


  if (!message) {
    return;
  }


  if (welcome) {
    welcome.style.display =
      "none";
  }


  addMessage(
    message,
    "user"
  );


  input.value = "";

  sendButton.disabled = true;


  /* THINKING */

  const thinking =
    document.createElement(
      "div"
    );

  thinking.className =
    "message bot";

  thinking.id =
    "thinking";


  thinking.innerHTML = `

    <div class="bubble thinking">

      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>

    </div>

  `;


  chat.appendChild(
    thinking
  );


  scrollBottom();


  try {

    const response =
      await fetch(
        VIXORA_API,
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({
              message: message
            })
        }
      );


    if (!response.ok) {

      const errorText =
        await response.text();

      throw new Error(
        errorText ||
        "Server error"
      );

    }


    thinking.remove();


    /* BOT MESSAGE */

    const botMessage =
      document.createElement(
        "div"
      );

    botMessage.className =
      "message bot";


    const botBubble =
      document.createElement(
        "div"
      );

    botBubble.className =
      "bubble streaming-cursor";


    botMessage.appendChild(
      botBubble
    );


    chat.appendChild(
      botMessage
    );


    /* STREAM */

    const reader =
      response.body.getReader();


    const decoder =
      new TextDecoder(
        "utf-8"
      );


    let fullText = "";


    while (true) {

      const {
        done,
        value
      } =
        await reader.read();


      if (done) {
        break;
      }


      const chunk =
        decoder.decode(
          value,
          {
            stream: true
          }
        );


      fullText += chunk;


      botBubble.innerHTML =
        renderMarkdown(
          fullText
        );


      scrollBottom();

    }


    /* FINAL RENDER */

    botBubble.innerHTML =
      renderMarkdown(
        fullText
      );


    botBubble.classList.remove(
      "streaming-cursor"
    );


    scrollBottom();


  } catch (error) {

    console.error(
      "Vixora Error:",
      error
    );


    if (thinking) {
      thinking.remove();
    }


    addMessage(
      "Vixora sedang mengalami masalah koneksi 😭",
      "bot"
    );

  }


  sendButton.disabled =
    false;

  input.focus();

}


/* =========================
   ADD MESSAGE
========================= */

function addMessage(
  text,
  type
) {

  const chat =
    document.getElementById(
      "chat"
    );


  const message =
    document.createElement(
      "div"
    );

  message.className =
    "message " + type;


  const bubble =
    document.createElement(
      "div"
    );

  bubble.className =
    "bubble";


  bubble.textContent =
    text;


  message.appendChild(
    bubble
  );


  chat.appendChild(
    message
  );


  scrollBottom();

}


/* =========================
   NEW CHAT
========================= */

function newChat() {

  const chat =
    document.getElementById(
      "chat"
    );


  chat.innerHTML = `

    <div
      class="welcome"
      id="welcome"
    >

      <div class="welcome-icon">
        ✦
      </div>

      <h1>
        Halo, aku Vixora 👋
      </h1>

      <p>
        Your AI. Your Way.
      </p>

      <div class="creator">
        Crafted by Viqi
      </div>

    </div>

  `;


  document
    .getElementById(
      "messageInput"
    )
    .focus();

}


/* =========================
   ENTER
========================= */

document
  .getElementById(
    "messageInput"
  )
  .addEventListener(
    "keydown",
    function(event) {

      if (
        event.key === "Enter"
      ) {

        event.preventDefault();

        sendMessage();

      }

    }
  );


/* =========================
   SCROLL
========================= */

function scrollBottom() {

  const chat =
    document.getElementById(
      "chat"
    );


  chat.scrollTop =
    chat.scrollHeight;

}

</script>

</body>
</html>
