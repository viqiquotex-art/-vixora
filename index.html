<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
  
<title>VIXORA</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #0b0b0f;
  color: white;
  font-family: Arial, sans-serif;
}

.app {
  height: 100vh;
  display: flex;
  flex-direction: column;
}

/* HEADER */

.header {
  height: 60px;
  padding: 0 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid #25252d;
}

.logo {
  display: flex;
  align-items: center;
  gap: 9px;
  font-weight: bold;
}

.logo-icon {
  width: 32px;
  height: 32px;
  border-radius: 9px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(135deg, #8b5cf6, #6366f1);
}

.status {
  font-size: 12px;
  color: #4ade80;
}

/* CHAT */

.chat {
  flex: 1;
  overflow-y: auto;
  padding: 30px 15px 110px;
}

.welcome {
  text-align: center;
  margin: 70px auto 30px;
}

.welcome-icon {
  width: 60px;
  height: 60px;
  margin: auto;
  border-radius: 18px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 28px;
  background: linear-gradient(135deg, #8b5cf6, #6366f1);
}

.welcome h1 {
  font-size: 27px;
  margin: 18px 0 8px;
}

.welcome p {
  color: #888894;
}

.creator {
  margin-top: 15px;
  font-size: 12px;
  color: #666673;
}

.message {
  max-width: 760px;
  margin: 0 auto 18px;
  display: flex;
}

.message.user {
  justify-content: flex-end;
}

.message.bot {
  justify-content: flex-start;
}

.bubble {
  max-width: 85%;
  padding: 12px 15px;
  border-radius: 17px;
  line-height: 1.6;
  font-size: 15px;
  overflow-wrap: break-word;
}

.user .bubble {
  background: linear-gradient(135deg, #7c3aed, #6366f1);
  border-bottom-right-radius: 5px;
  white-space: pre-wrap;
}

.bot .bubble {
  background: #17171d;
  border: 1px solid #292932;
  border-bottom-left-radius: 5px;
}

/* MARKDOWN */

.bot strong {
  font-weight: bold;
}

.bot em {
  font-style: italic;
}

.bot code {
  background: #0d0d12;
  padding: 2px 5px;
  border-radius: 5px;
  font-family: monospace;
}

.bot pre {
  background: #0d0d12;
  padding: 12px;
  border-radius: 9px;
  overflow-x: auto;
}

.bot pre code {
  padding: 0;
  background: transparent;
}

/* INPUT */

.input-area {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  padding: 12px;
  background: #0b0b0f;
}

.input-box {
  max-width: 760px;
  margin: auto;
  display: flex;
  gap: 8px;
  padding: 6px;
  border: 1px solid #292932;
  border-radius: 17px;
  background: #17171d;
}

#messageInput {
  flex: 1;
  min-width: 0;
  border: 0;
  outline: 0;
  background: transparent;
  color: white;
  padding: 11px;
  font-size: 15px;
}

#messageInput::placeholder {
  color: #686873;
}

#sendButton {
  width: 42px;
  height: 42px;
  border: 0;
  border-radius: 12px;
  background: linear-gradient(135deg, #8b5cf6, #6366f1);
  color: white;
  font-size: 20px;
  cursor: pointer;
  flex-shrink: 0;
}

#sendButton:active {
  transform: scale(0.94);
}

#sendButton:disabled {
  opacity: 0.5;
}

#newChatButton {
  border: 1px solid #292932;
  background: #17171d;
  color: #aaaab5;
  padding: 7px 10px;
  border-radius: 9px;
  cursor: pointer;
}

@media (max-width: 600px) {

  .status {
    display: none;
  }

  .bubble {
    max-width: 88%;
  }

}
</style>
</head>

<body>

<div class="app">

  <!-- HEADER -->

  <div class="header">

    <div class="logo">

      <div class="logo-icon">
        V
      </div>

      <span>
        VIXORA
      </span>

    </div>

    <div style="display:flex;align-items:center;gap:10px;">

      <div class="status">
        ● AI Online
      </div>

      <button
        id="newChatButton"
        onclick="newChat()"
      >
        + New Chat
      </button>

    </div>

  </div>


  <!-- CHAT -->

  <div
    class="chat"
    id="chat"
  >

    <div
      class="welcome"
      id="welcome"
    >

      <div class="welcome-icon">
        ✦
      </div>

      <h1>
        Halo, aku Vixora 👋
      </h1>

      <p>
        Your AI. Your Way.
      </p>

      <div class="creator">
        Crafted by Viqi
      </div>

    </div>

  </div>


  <!-- INPUT -->

  <div class="input-area">

    <div class="input-box">

      <input
        id="messageInput"
        type="text"
        placeholder="Tanya sesuatu ke Vixora..."
        autocomplete="off"
      >

      <button
        id="sendButton"
        onclick="sendMessage()"
      >
        ↑
      </button>

    </div>

  </div>

</div>


<script>

/* =================================
   VIXORA WORKER
================================= */

const API =
  "https://black-limit-8938.viqiquotex.workers.dev/";


/* =================================
   MARKDOWN SEDERHANA
================================= */

function formatText(text) {

  let html = text;

  html = html
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");

  html = html.replace(
    /```([\s\S]*?)```/g,
    "<pre><code>$1</code></pre>"
  );

  html = html.replace(
    /`([^`]+)`/g,
    "<code>$1</code>"
  );

  html = html.replace(
    /\*\*(.*?)\*\*/g,
    "<strong>$1</strong>"
  );

  html = html.replace(
    /\*([^*]+)\*/g,
    "<em>$1</em>"
  );

  html = html.replace(
    /\n/g,
    "<br>"
  );

  return html;
}


/* =================================
   ADD MESSAGE
================================= */

function addMessage(text, type) {

  const message =
    document.createElement("div");

  message.className =
    "message " + type;

  const bubble =
    document.createElement("div");

  bubble.className =
    "bubble";

  if (type === "bot") {

    bubble.innerHTML =
      formatText(text);

  } else {

    bubble.textContent =
      text;

  }

  message.appendChild(bubble);

  document
    .getElementById("chat")
    .appendChild(message);

  scrollBottom();
}


/* =================================
   SEND MESSAGE
================================= */

async function sendMessage() {

  const input =
    document.getElementById(
      "messageInput"
    );

  const button =
    document.getElementById(
      "sendButton"
    );

  const message =
    input.value.trim();

  if (!message) {
    return;
  }


  /* HILANGKAN WELCOME */

  const welcome =
    document.getElementById(
      "welcome"
    );

  if (welcome) {
    welcome.remove();
  }


  /* PESAN USER */

  addMessage(
    message,
    "user"
  );

  input.value = "";

  button.disabled = true;


  /* THINKING */

  const thinking =
    document.createElement("div");

  thinking.className =
    "message bot";

  thinking.innerHTML = `
    <div class="bubble">
      Vixora sedang berpikir...
    </div>
  `;

  document
    .getElementById("chat")
    .appendChild(thinking);

  scrollBottom();


  try {

    /* =========================
       REQUEST KE WORKER
    ========================= */

    const response =
      await fetch(
        API,
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body: JSON.stringify({
            message: message
          })
        }
      );


    /* =========================
       ERROR RESPONSE
    ========================= */

    if (!response.ok) {

      let errorMessage =
        "Vixora gagal terhubung ke server.";

      try {

        const errorData =
          await response.json();

        if (errorData.error) {

          errorMessage =
            errorData.error;

        }

      } catch {

        errorMessage =
          "Server mengembalikan error HTTP " +
          response.status;

      }

      throw new Error(
        errorMessage
      );
    }


    /* HAPUS THINKING */

    thinking.remove();


    /* =========================
       BOT MESSAGE
    ========================= */

    const botMessage =
      document.createElement(
        "div"
      );

    botMessage.className =
      "message bot";


    const bubble =
      document.createElement(
        "div"
      );

    bubble.className =
      "bubble";


    botMessage.appendChild(
      bubble
    );


    document
      .getElementById("chat")
      .appendChild(
        botMessage
      );


    /* =========================
       STREAMING RESPONSE
    ========================= */

    if (
      response.body &&
      response.body.getReader
    ) {

      const reader =
        response.body.getReader();

      const decoder =
        new TextDecoder();

      let answer = "";


      while (true) {

        const result =
          await reader.read();

        if (result.done) {
          break;
        }

        answer +=
          decoder.decode(
            result.value,
            {
              stream: true
            }
          );

        bubble.innerHTML =
          formatText(answer);

        scrollBottom();
      }


      /* FLUSH DECODER */

      answer +=
        decoder.decode();

      bubble.innerHTML =
        formatText(answer);

    } else {

      const answer =
        await response.text();

      bubble.innerHTML =
        formatText(answer);

    }

  } catch (error) {

    console.error(
      "VIXORA ERROR:",
      error
    );


    thinking.remove();


    /* =========================
       ERROR MESSAGE
    ========================= */

    addMessage(
      error.message ||
      "Vixora sedang mengalami masalah koneksi 😭",
      "bot"
    );

  }


  button.disabled = false;

  input.focus();
}


/* =================================
   ENTER
================================= */

document
  .getElementById(
    "messageInput"
  )
  .addEventListener(
    "keydown",
    function(event) {

      if (
        event.key === "Enter"
      ) {

        event.preventDefault();

        sendMessage();

      }

    }
  );


/* =================================
   NEW CHAT
================================= */

function newChat() {

  document
    .getElementById("chat")
    .innerHTML = `

      <div
        class="welcome"
        id="welcome"
      >

        <div class="welcome-icon">
          ✦
        </div>

        <h1>
          Halo, aku Vixora 👋
        </h1>

        <p>
          Your AI. Your Way.
        </p>

        <div class="creator">
          Crafted by Viqi
        </div>

      </div>

  `;

  document
    .getElementById(
      "messageInput"
    )
    .focus();
}


/* =================================
   SCROLL
================================= */

function scrollBottom() {

  const chat =
    document.getElementById(
      "chat"
    );

  chat.scrollTop =
    chat.scrollHeight;
}

</script>

</body>
</html>
````
